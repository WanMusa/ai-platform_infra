services:
  postgres:
    image: postgres:17

    container_name: postgres

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

    networks:
      - ai_platform

  pgadmin:
    image: dpage/pgadmin4

    container_name: pgadmin

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8080:80"

    networks:
      - ai_platform

volumes:
  postgres_data:

networks:
  ai_platform:
    external: true
