name: Deploy to Oracle VPS

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --no-env-resolution --quiet

      - name: Keep Grafana private behind Cloudflare Tunnel
        run: |
          docker compose --env-file .env.example config --format json --no-env-resolution | python -c '
          import json
          import sys

          config = json.load(sys.stdin)
          grafana = config["services"]["grafana"]
          tunnel = config["services"]["cloudflared"]
          assert not grafana.get("ports")
          assert config["networks"]["observability"].get("internal") is True
          assert "observability" in tunnel["networks"]
          assert "tunnel_egress" in tunnel["networks"]
          assert tunnel["environment"]["TUNNEL_TOKEN"]
          print("Grafana is private and routed through Cloudflare Tunnel")
          '

      - name: Validate Alloy config
        run: >-
          docker run --rm
          -v "$PWD/observability/alloy.alloy:/etc/alloy/config.alloy:ro"
          grafana/alloy:v1.21.3 fmt /etc/alloy/config.alloy >/dev/null

      - name: Validate Loki config
        run: >-
          docker run --rm
          -v "$PWD/observability/loki-config.yml:/etc/loki/config.yml:ro"
          grafana/loki:3.7.9 -config.file=/etc/loki/config.yml -verify-config=true

      - name: Validate provisioned dashboard JSON
        run: python -m json.tool observability/grafana/dashboards/resume-builder-v3.json > /dev/null

  deploy:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            DEPLOY_DIR="$HOME/projects/ai-platform_infra"

            # Create parent directory if it doesn't exist
            mkdir -p "$HOME/projects"

            # First deployment: clone repo
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
                echo "=== FIRST DEPLOYMENT ==="
                echo "Repository not found. Cloning..."

                git clone https://github.com/WanMusa/ai-platform_infra.git "$DEPLOY_DIR"
            else
                echo "=== EXISTING DEPLOYMENT ==="

                cd "$DEPLOY_DIR"

                echo "=== BEFORE ==="
                git rev-parse HEAD

                git fetch origin
                git reset --hard origin/main
            fi

            cd "$DEPLOY_DIR"
            
            docker compose pull

            if ! docker network inspect ai_platform >/dev/null 2>&1; then
                echo "Creating ai_platform network..."
                docker network create ai_platform
            else
                echo "ai_platform network already exists"
            fi

            docker compose up -d --remove-orphans

            echo "=== AFTER ==="
            git rev-parse HEAD

            echo "=== DEPLOY COMPLETE ==="